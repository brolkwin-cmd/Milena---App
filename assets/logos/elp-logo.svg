    <rect x="5" y="10" width="58" height="48" rx="8" fill="url(#elpCard)" stroke="#00BFFC" stroke-width="2"/>
    <!-- Card Stripe -->
    <rect x="5" y="20" width="58" height="9" fill="#00BFFC" opacity="0.85"/>
    <!-- Chip -->
    <rect x="12" y="34" width="12" height="10" rx="2" fill="#F59E0B"/>
