  </g>
  <!-- Text Brand -->
  <text x="88" y="46" font-family="'Unbounded', sans-serif" font-weight="900" font-size="32" fill="#10121A" letter-spacing="-0.5">ELP</text>
  <text x="165" y="46" font-family="'Unbounded', sans-serif" font-weight="700" font-size="15" fill="#00BFFC">· PAY</text>
  <text x="89" y="68" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10.5" fill="#5A5868" letter-spacing="1.5">EN LÍNEA PAGOS BY BPM</text>
</svg>
