<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <defs>
    <linearGradient id="elpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFC" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="elpCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10121A" />
      <stop offset="100%" stop-color="#1E2333" />
    </linearGradient>
  </defs>
  <!-- Icon Emblem -->
  <g transform="translate(10, 10)">
