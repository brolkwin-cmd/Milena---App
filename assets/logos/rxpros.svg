<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160">
  <!-- R symbol -->
  <g>
    <!-- R vertical bar -->
    <rect x="30" y="30" width="18" height="100" rx="9" fill="url(#grad1)"/>
    <!-- R bump top -->
    <path d="M48 30 Q90 30 90 60 Q90 90 48 90" stroke="url(#grad1)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- R leg -->
    <line x1="56" y1="90" x2="90" y2="130" stroke="url(#grad2)" stroke-width="18" stroke-linecap="round"/>
    <!-- X cross -->
    <line x1="105" y1="80" x2="135" y2="130" stroke="url(#grad2)" stroke-width="14" stroke-linecap="round"/>
    <line x1="135" y1="80" x2="105" y2="130" stroke="url(#grad2)" stroke-width="14" stroke-linecap="round"/>
  </g>
  <!-- "Pros" text -->
  <text x="155" y="115" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="78" font-weight="800" fill="url(#grad1)" letter-spacing="-2">Pros</text>
  <!-- TM -->
  <text x="370" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="url(#grad1)">TM</text>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5DB8D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3ECFC0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3ECFC0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ABFB5;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
