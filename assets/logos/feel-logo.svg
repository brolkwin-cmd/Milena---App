<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <defs>
    <linearGradient id="feelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFC" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <linearGradient id="feelDoc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFC" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0077B6" stop-opacity="0.4" />
    </linearGradient>
  </defs>
  <!-- Icon Emblem -->
  <g transform="translate(10, 10)">
