    <rect x="5" y="5" width="50" height="60" rx="10" fill="url(#feelDoc)" stroke="#00BFFC" stroke-width="2.5"/>
    <path d="M35 5 L55 25 L35 25 Z" fill="#00BFFC" opacity="0.8"/>
    <!-- Check & Lines -->
    <line x1="16" y1="26" x2="30" y2="26" stroke="#00BFFC" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="36" x2="44" y2="36" stroke="#00BFFC" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="46" x2="38" y2="46" stroke="#00BFFC" stroke-width="2.5" stroke-linecap="round"/>
    <!-- DIAN Verified Shield Badge -->
    <circle cx="48" cy="55" r="14" fill="#10121A" stroke="#00BFFC" stroke-width="2"/>
    <path d="M43 55 L47 59 L54 51" fill="none" stroke="#00BFFC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Text Brand -->
  <text x="88" y="48" font-family="'Unbounded', sans-serif" font-weight="900" font-size="34" fill="#10121A" letter-spacing="-0.5">FEEL</text>
  <text x="195" y="48" font-family="'Unbounded', sans-serif" font-weight="700" font-size="16" fill="#00BFFC">· DIAN</text>
  <text x="89" y="68" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10.5" fill="#5A5868" letter-spacing="1.5">FACTURACIÓN &amp; DOCS ELECTRÓNICOS</text>
